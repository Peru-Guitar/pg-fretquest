      <rect x="15" y="9" width="5" height="6" rx="2"/>
      <rect x="15" y="18" width="5" height="6" rx="2"/>
      <rect x="15" y="27" width="5" height="6" rx="2"/>
      <rect x="44" y="9" width="5" height="6" rx="2"/>
      <rect x="44" y="18" width="5" height="6" rx="2"/>
      <rect x="44" y="27" width="5" height="6" rx="2"/>
    </g>
    <!-- Broad headstock, tapered shoulders, nut and short neck. -->
    <path d="M23 5q9 4 18 0v27c0 5-4 7-4 12v13H27V44c0-5-4-7-4-12Z" fill="#fff" stroke="#12324a" stroke-width="1.5" stroke-linejoin="round"/>
    <g fill="#1f6fa5">
