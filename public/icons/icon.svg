      <circle cx="37" cy="13" r="1.7"/><circle cx="37" cy="22" r="1.7"/><circle cx="37" cy="31" r="1.7"/>
    </g>
    <g stroke="#1f6fa5" stroke-width=".8" stroke-linecap="round">
      <path d="m27 13 3 30v13m-3-34 4 21v13m-4-25 5 12v13m5-43-3 30v13m3-34-4 21v13m4-25-5 12v13"/>
    </g>
    <path d="M27 43h10" stroke="#12324a" stroke-width="2.5"/>
    <path d="M28 50h8" stroke="#1f6fa5" stroke-width="1.5"/>
