      <stop offset=".55" stop-color="#3198dc"/>
      <stop offset="1" stop-color="#1c5f8f"/>
    </linearGradient>
    <linearGradient id="edge" x1="9" y1="12" x2="53" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6efff"/>
      <stop offset="1" stop-color="#5ab8ec"/>
